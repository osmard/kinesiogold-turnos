<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KinesioGold — Display</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { overflow: hidden; cursor: none; }

    /* ── Layout principal ── */
    .display-body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .display-content {
      display: flex;
      flex-direction: row;
      flex: 1;
      overflow: hidden;
      /* sobrescribe el position:relative del CSS global */
      position: static !important;
    }

    /* ── Panel de video (izquierda, siempre visible) ── */
    .video-panel {
      flex: 0 0 46%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid var(--color-border);
      position: relative;
    }

    .video-panel video,
    .video-panel iframe {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border: none;
    }

    .video-panel .no-video-msg {
      color: var(--color-text-muted);
      font-size: 0.95rem;
      text-align: center;
      padding: 24px;
    }

    /* ── Columna de pacientes (derecha) ── */
    .patients-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .display-panel {
      flex: 1;
      padding: 24px 32px;
      overflow-y: auto;
    }

    .display-panel + .display-panel {
      border-top: 1px solid var(--color-border);
    }

    /* ── Cards "en consultorio" ── */
    .en-consultorio-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--color-secondary);
      border: 1px solid var(--color-border);
      border-left: 4px solid #5C6BC0;
      border-radius: var(--radius);
      padding: 14px 20px;
      margin-bottom: 10px;
      animation: slideIn 0.3s ease;
    }

    .en-consultorio-card .ec-name { font-size: 1.3rem; font-weight: 800; }
    .en-consultorio-card .ec-info { font-size: 0.85rem; color: var(--color-text-muted); margin-top: 3px; }
    .en-consultorio-card .ec-info span { color: #5C6BC0; font-weight: 600; }

    .ec-badge {
      background: #5C6BC0; color: #fff;
      font-size: 0.7rem; font-weight: 700;
      padding: 3px 10px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: .05em;
      white-space: nowrap;
    }

    /* patient cards más compactas para que quepan más */
    .patient-card {
      padding: 14px 20px;
      margin-bottom: 8px;
    }

    .patient-name { font-size: 1.5rem; }
  </style>
</head>
<body class="display-body">

<!-- Pantalla de inicio -->
<div class="start-overlay" id="start-overlay" onclick="initDisplay()">
  <img src="/LogoKinesioGoldBlanco.jpeg" alt="KinesioGold">
  <p>Toca para iniciar el display</p>
</div>

<header class="display-header">
  <img src="/LogoKinesioGoldBlanco.jpeg" alt="KinesioGold" class="logo">
  <div style="text-align:right;">
    <div id="clock" style="font-size:2rem;font-weight:800;color:var(--color-accent);"></div>
    <div class="display-date" id="display-date"></div>
  </div>
</header>

<div class="display-content">

  <!-- Panel izquierdo: video — NUNCA se toca desde socket/renderPatients -->
  <div class="video-panel" id="panel-video">
    <video id="carousel-video" autoplay muted playsinline preload="auto"
           style="width:100%;height:100%;object-fit:contain;"></video>
    <div class="no-video-msg hidden" id="no-video">Sin videos configurados</div>
  </div>

  <!-- Columna derecha: pacientes — único contenedor actualizado por socket -->
  <div class="patients-column" id="panel-pacientes">

    <!-- Sección superior: en espera -->
    <div class="display-panel" id="panel-esperando">
      <div class="display-section-title">Pacientes en espera</div>
      <div id="patient-list"></div>
      <div class="no-patients hidden" id="no-patients" style="height:auto;padding:24px 0;">
        <span style="font-size:2rem;opacity:0.2;">⏳</span>
        <span style="margin-top:8px;font-size:1rem;">Sin pacientes en espera</span>
      </div>
    </div>

    <!-- Sección inferior: en consultorio -->
    <div class="display-panel" id="panel-consultorio">
      <div class="display-section-title">En consultorio</div>
      <div id="consultorio-list"></div>
      <div class="no-patients hidden" id="no-en-consultorio" style="height:auto;padding:24px 0;">
        <span style="font-size:2rem;opacity:0.2;">🏥</span>
        <span style="margin-top:8px;font-size:1rem;">Sin pacientes en atención</span>
      </div>
    </div>

  </div>
</div>

<!-- Overlay de llamado -->
<div class="overlay hidden" id="call-overlay">
  <div class="overlay-pulse"></div>
  <div class="overlay-badge">&#128266; Llamando al paciente</div>
  <div class="overlay-name" id="overlay-name"></div>
  <div class="overlay-detail" id="overlay-detail"></div>
  <div class="overlay-bar" id="overlay-bar"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ── Audio / TTS ───────────────────────────────────────────────
let audioCtx = null;

function playDing() {
  if (!audioCtx) return;
  [[880, 0], [1108, 0.18], [880, 0.36]].forEach(([freq, delay]) => {
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = freq;
    const t = audioCtx.currentTime + delay;
    gain.gain.setValueAtTime(0.45, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
    osc.start(t);
    osc.stop(t + 0.28);
  });
}

function speak(text) {
  const url   = '/api/tts?text=' + encodeURIComponent(text);
  const audio = new Audio(url);
  setTimeout(() => audio.play().catch(() => {}), 800);
}

// ── Estado ────────────────────────────────────────────────────
let esperando       = [];
let enConsultorio   = [];
let overlayActive   = false;
let overlayTimer    = null;
let videos          = [];
let carouselIdx     = 0;
let currentVideoUrl = '';
let started         = false;

// ── Init ──────────────────────────────────────────────────────
function initDisplay() {
  if (started) return;
  started = true;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  document.getElementById('start-overlay').remove();
  updateClock();
  setInterval(updateClock, 1000);
  loadVideos();
  initSocket();
  speak('Sistema listo');
}

function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('es-PY', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('display-date').textContent =
    now.toLocaleDateString('es-PY', { weekday: 'long', day: 'numeric', month: 'long' });
}

// ── Socket ────────────────────────────────────────────────────
function initSocket() {
  const socket = io({ reconnection: true, reconnectionDelay: 2000 });

  socket.on('connect', async () => {
    const today = new Date().toISOString().slice(0, 10);
    const res   = await fetch(`/api/pacientes?fecha=${today}`);
    const all   = await res.json();
    esperando     = all.filter(p => p.estado === 'esperando');
    enConsultorio = all.filter(p => p.estado === 'llamado');
    renderPatients();
  });

  socket.on('pacientes:updated', ({ pacientes }) => {
    esperando     = pacientes.filter(p => p.estado === 'esperando');
    enConsultorio = pacientes.filter(p => p.estado === 'llamado');
    if (!overlayActive) renderPatients();
  });

  socket.on('paciente:llamado', ({ nombre, consultorio, licenciado }) => {
    playDing();
    pauseCurrentVideo();
    showOverlay(nombre, consultorio, licenciado);
    speak(`${nombre}, por favor pasar al ${consultorio}, con ${licenciado}`);
  });
}

// ── Render pacientes (#panel-pacientes únicamente) ────────────
function renderPatients() {
  const list    = document.getElementById('patient-list');
  const noP     = document.getElementById('no-patients');
  const conList = document.getElementById('consultorio-list');
  const noC     = document.getElementById('no-en-consultorio');

  if (esperando.length > 0) {
    noP.classList.add('hidden');
    list.innerHTML = esperando.map(p => `
      <div class="patient-card">
        <div>
          <div class="patient-name">${p.nombre}</div>
          <div class="patient-info">Lic. <span>${p.licenciado_nombre}</span></div>
        </div>
        <span class="badge badge-esperando">En espera</span>
      </div>
    `).join('');
  } else {
    list.innerHTML = '';
    noP.classList.remove('hidden');
  }

  if (enConsultorio.length > 0) {
    noC.classList.add('hidden');
    conList.innerHTML = enConsultorio.map(p => `
      <div class="en-consultorio-card">
        <div>
          <div class="ec-name">${p.nombre}</div>
          <div class="ec-info">
            <span>${p.consultorio_actual_nombre || '—'}</span>
            &nbsp;·&nbsp; Lic. <span>${p.licenciado_nombre}</span>
          </div>
        </div>
        <span class="ec-badge">En atención</span>
      </div>
    `).join('');
  } else {
    conList.innerHTML = '';
    noC.classList.remove('hidden');
  }
}

// ── Overlay ───────────────────────────────────────────────────
function showOverlay(nombre, consultorio, licenciado) {
  clearTimeout(overlayTimer);
  overlayActive = true;

  document.getElementById('overlay-name').textContent   = nombre;
  document.getElementById('overlay-detail').textContent =
    `${consultorio} · Lic. ${licenciado}`;

  const bar = document.getElementById('overlay-bar');
  bar.style.animation = 'none';
  bar.offsetHeight;
  bar.style.animation = 'progressBar 10s linear forwards';

  document.getElementById('call-overlay').classList.remove('hidden');

  overlayTimer = setTimeout(() => {
    document.getElementById('call-overlay').classList.add('hidden');
    overlayActive = false;
    renderPatients();
    resumeCurrentVideo();
  }, 10000);
}

// ── URL helper ────────────────────────────────────────────────
function toDirectUrl(url) {
  // Google Drive /file/d/ID/... → descarga directa reproducible como <video src>
  const m = url.match(/\/file\/d\/([^/?#]+)/);
  if (m) return `https://drive.google.com/uc?export=download&id=${m[1]}`;
  return url; // MP4 directo, /videos/archivo.mp4, etc.
}

// ── Carrusel — solo <video> nativo, sin iframes ───────────────
async function loadVideos() {
  try {
    const res = await fetch('/api/videos?activo=true');
    videos = await res.json();
  } catch (e) { videos = []; }

  const vid   = document.getElementById('carousel-video');
  const noVid = document.getElementById('no-video');

  if (!videos.length) {
    noVid.classList.remove('hidden');
    return;
  }
  noVid.classList.add('hidden');

  if (videos.length === 1) {
    // Un solo video: loop nativo del tag, sin recargas
    vid.loop = true;
  } else {
    // Múltiples videos: avanzar al terminar cada uno
    vid.loop = false;
    vid.addEventListener('ended', () => playVideoAt(carouselIdx + 1));
  }

  // Si el video falla (URL inaccesible), intentar el siguiente
  vid.addEventListener('error', () => {
    if (videos.length > 1) setTimeout(() => playVideoAt(carouselIdx + 1), 2000);
  });

  playVideoAt(0);
}

function playVideoAt(idx) {
  if (!videos.length) return;
  carouselIdx = idx % videos.length;
  const url = toDirectUrl(videos[carouselIdx].url);
  const vid = document.getElementById('carousel-video');
  // Solo cambiar src si es un video diferente — evita recargas en loop de 1 video
  if (currentVideoUrl !== url) {
    currentVideoUrl = url;
    vid.src = url;
    vid.load();
  }
  vid.play().catch(() => {});
}

// ── Pause / Resume — control directo, sin postMessage ────────
function pauseCurrentVideo() {
  if (!videos.length) return;
  document.getElementById('carousel-video').pause();
}

function resumeCurrentVideo() {
  if (!videos.length) return;
  document.getElementById('carousel-video').play().catch(() => {});
}
</script>
</body>
</html>
